name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Definir versão
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build label-agent.exe
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o pacote/label-agent.exe .

      - name: Montar pacote
        run: |
          cp INSTALAR.bat install.ps1 pacote/
          # .bat precisa de CRLF no Windows
          sed -i 's/\r*$/\r/' pacote/INSTALAR.bat
          # PowerShell 5.1 só lê UTF-8 (acentos/emojis) corretamente com BOM
          printf '\xEF\xBB\xBF' | cat - pacote/install.ps1 > pacote/tmp.ps1 && mv pacote/tmp.ps1 pacote/install.ps1
          cd pacote && zip -r "../LabelAgent-windows-${{ steps.ver.outputs.version }}.zip" .

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: LabelAgent-windows-${{ steps.ver.outputs.version }}
          path: pacote/

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: LabelAgent-windows-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
